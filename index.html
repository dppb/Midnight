<title>Hornbill</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--coral:#FF8576;--teal:#2CC4B4;--fibre:#FFFFFF;--mist:rgba(255,255,255,.8);--ember:#FFC2B8;
  --font:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--fibre);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
html{background:#0B1230}
body{background:radial-gradient(120% 80% at 10% 0%,#1F6F78 0%,rgba(31,111,120,0) 60%),radial-gradient(120% 80% at 100% 100%,#8A4A52 0%,rgba(138,74,82,0) 55%),linear-gradient(170deg,#132447,#1B2347);min-height:100vh;
  padding:calc(env(safe-area-inset-top,0px) + 12vh) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.box{max-width:360px;margin:0 auto;padding:26px 22px 22px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
  -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 18px 40px rgba(5,8,28,.35)}
.logo{text-align:center}.logo img{border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
h1{font-size:26px;margin:10px 0 2px;text-align:center}
.sub{color:var(--mist);font-size:14.5px;margin:0 0 18px;text-align:center}
label{display:block;font-size:13px;color:var(--mist);margin-top:14px}
input{width:100%;background:rgba(0,0,0,.22);color:#fff;border:1px solid rgba(255,255,255,.24);border-radius:14px;padding:12px 13px;font:inherit;font-size:16px;margin-top:5px}
button{width:100%;margin-top:20px;background:linear-gradient(135deg,var(--teal),var(--coral));color:#fff;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.6}
.msg{min-height:20px;margin-top:14px;font-size:13.5px;color:var(--mist);text-align:center}
.msg.bad{color:var(--ember)}
.hidden{display:none}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div class="box">
  <div class="logo" aria-hidden="true"><img src="icon-192.png" alt="" width="72" height="72"></div><h1>Hornbill</h1>
  <p class="sub" id="sub">Opening&hellip;</p>
  <form id="form" class="hidden" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button id="go" type="submit">Sign in</button>
  </form>
  <button id="retry" type="button" class="hidden">Try again</button>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</div>
<script>
(function () {
  'use strict';
  /* notifications: the background worker lives next to this page */
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
  /* ---- the only two values to edit: from Supabase, Connect (or Settings > API Keys) ---- */
  var SUPABASE_URL = 'https://nmsocqsfiipqkxljxcgg.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_7phJG3PZwOLAQbVWVVfguw_Sv6mt4uf';
  /* ---- the private app, uploaded to Supabase Storage ---- */
  var BUCKET = 'os-app', FILE = 'app.html';

  function $(id) { return document.getElementById(id); }
  function say(t, bad) { var m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (bad ? ' bad' : ''); }
  function showForm(note, bad) {
    $('sub').textContent = 'Sign in to open your day.';
    $('form').classList.remove('hidden'); $('retry').classList.add('hidden');
    $('go').disabled = false; say(note, bad);
  }
  function showRetry(title, note) {
    $('sub').textContent = title;
    $('form').classList.add('hidden'); $('retry').classList.remove('hidden');
    say(note, true);
  }

  if (SUPABASE_URL.indexOf('YOUR-') >= 0 || SUPABASE_ANON_KEY.indexOf('YOUR') >= 0) {
    $('sub').textContent = 'Setup is not finished.';
    say('Paste your Supabase Project URL and publishable key into this file (index.html).', true);
    return;
  }
  if (!window.supabase || !window.supabase.createClient) {
    showRetry('Could not open the app.', 'The sign-in library did not load. Check the connection, then try again.');
    $('retry').onclick = function () { window.location.reload(); };
    return;
  }
  var base = SUPABASE_URL.replace(/\/$/, '');
  var sb = window.supabase.createClient(base, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: false, detectSessionInUrl: false }
  });

  function openApp(session) {
    $('sub').textContent = 'Opening\u2026'; say('');
    $('form').classList.add('hidden'); $('retry').classList.add('hidden');
    fetch(base + '/storage/v1/object/' + BUCKET + '/' + FILE, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + session.access_token },
      cache: 'no-store'
    }).then(function (res) {
      if (!res.ok) throw { status: res.status };
      return res.text();
    }).then(function (html) {
      if (!/<html[\s>]/i.test(html) || (html.indexOf('Hornbill') < 0 && html.indexOf('OS-v2') < 0)) throw { status: 'notapp' };
      var cfg = '<script>window.__OS_CFG__=' + JSON.stringify({ url: base, key: SUPABASE_ANON_KEY }) + ';<\/script>';
      html = html.replace(/<head>/i, '<head>' + cfg);
      document.open();
      document.write(html);
      document.close();
    }).catch(function (e) {
      var st = e && e.status;
      if (st === 401 || st === 403) {
        sb.auth.signOut({ scope: 'local' }).then(function () { showForm('Your sign-in has expired. Sign in again.', true); },
          function () { showForm('Your sign-in has expired. Sign in again.', true); });
      } else if (st === 400 || st === 404) {
        showRetry('Could not open the app.', 'app.html is not in the os-app storage bucket, or this account is not the owner. Check the setup, then try again.');
      } else if (st === 'notapp') {
        showRetry('Could not open the app.', 'The file in storage is not the Hornbill app. Upload app.html again.');
      } else {
        showRetry('Could not open the app.', 'No connection. Try again when you are online.');
      }
    });
  }
  function start() {
    $('sub').textContent = 'Opening\u2026'; say('');
    sb.auth.getSession().then(function (r) {
      var s = r && r.data && r.data.session;
      if (s) openApp(s); else showForm('');
    }, function () { showRetry('Could not open the app.', 'No connection. Try again when you are online.'); });
  }
  $('retry').onclick = start;
  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var email = $('email').value.trim(), pw = $('password').value;
    if (!email || !pw) { say('Enter your email and password.', true); return; }
    $('go').disabled = true; say('Signing in\u2026');
    sb.auth.signInWithPassword({ email: email, password: pw }).then(function (r) {
      if (r.error || !r.data || !r.data.session) {
        $('go').disabled = false;
        var m = r.error ? r.error.message : 'Sign-in failed.';
        say(/invalid/i.test(m) ? 'That email and password do not match.' : /confirm/i.test(m) ? 'This user is not confirmed. Tick Auto Confirm when creating it.' : m, true);
        return;
      }
      $('password').value = '';
      openApp(r.data.session);
    }, function () { $('go').disabled = false; say('No connection. Try again when you are online.', true); });
  });
  start();
})();
</script>
</body>
</html>
